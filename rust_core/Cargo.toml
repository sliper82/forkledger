[package]
name = "forkledger_core"
version = "0.4.0"
edition = "2021"
description = "High-performance Rust core for ForkLedger"

[lib]
name = "forkledger_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"         # parallel iteration
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
