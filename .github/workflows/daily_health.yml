name: Daily Health Check

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC (08:00 Sofia time)
  workflow_dispatch:        # can also trigger manually from GitHub UI

jobs:
  health:
    name: Full health check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" langchain langchain-core

      - name: Run all tests
        run: pytest tests/ -v --tb=short

      - name: Lint check
        run: |
          pip install ruff -q
          ruff check src/ tests/

      - name: Check PyPI version matches repo
        run: |
          python3 - << 'EOF'
          import urllib.request, json, tomllib, pathlib
          
          # Get PyPI version
          try:
              req = urllib.request.urlopen("https://pypi.org/pypi/forkledger/json")
              pypi_version = json.loads(req.read())["info"]["version"]
          except Exception as e:
              print(f"PyPI check failed: {e}")
              pypi_version = "unknown"
          
          # Get repo version
          with open("pyproject.toml", "rb") as f:
              repo_version = tomllib.load(f)["project"]["version"]
          
          print(f"PyPI version:  {pypi_version}")
          print(f"Repo version:  {repo_version}")
          
          if pypi_version != repo_version:
              print(f"WARNING: versions differ — repo={repo_version}, pypi={pypi_version}")
          else:
              print("OK: versions match")
          EOF

      - name: Verify pip install works
        run: |
          pip install forkledger --upgrade -q
          python -c "import forkledger; print('pip install OK, version:', forkledger.__version__)"

      - name: Test LangChain integration
        run: python examples/langchain_quickstart.py

      - name: Test AutoGen integration
        run: python examples/autogen_quickstart.py

      - name: Run benchmark
        run: python benchmarks/locomo_benchmark.py --records 200 --queries 50

      - name: Summary
        if: always()
        run: |
          echo "=========================="
          echo "Daily health check complete"
          echo "Time: $(date)"
          echo "=========================="

  notify-on-failure:
    name: Email on failure
    runs-on: ubuntu-latest
    needs: health
    if: failure()

    steps:
      - name: Send failure notification
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily Health Check Failed — ${new Date().toISOString().slice(0,10)}`,
              body: `## Automated Health Check Failure\n\nThe daily health check workflow failed.\n\n**Time:** ${new Date().toISOString()}\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n### What to do\n1. Click the Run link above to see what failed\n2. Open a new chat with Claude\n3. Share this issue link\n4. Claude will diagnose and fix\n\n*This issue was created automatically by the daily health check.*`,
              labels: ['automated', 'health-check']
            });
