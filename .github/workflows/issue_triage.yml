name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label and welcome
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();

            // Auto-label based on content
            const labels = [];

            if (title.includes('bug') || title.includes('error') || title.includes('fail') ||
                title.includes('broken') || body.includes('traceback') || body.includes('exception')) {
              labels.push('bug');
            }

            if (title.includes('feature') || title.includes('request') || title.includes('add') ||
                title.includes('support') || title.includes('enhance')) {
              labels.push('enhancement');
            }

            if (title.includes('question') || title.includes('how') || title.includes('help') ||
                title.includes('docs') || title.includes('documentation')) {
              labels.push('question');
            }

            if (title.includes('langchain') || body.includes('langchain')) {
              labels.push('integration:langchain');
            }

            if (title.includes('autogen') || body.includes('autogen')) {
              labels.push('integration:autogen');
            }

            if (title.includes('mcp') || body.includes('mcp server')) {
              labels.push('integration:mcp');
            }

            if (title.includes('performance') || title.includes('slow') || title.includes('speed')) {
              labels.push('performance');
            }

            // Apply labels (create if needed)
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labels
                });
              } catch (e) {
                console.log('Label error (may not exist yet):', e.message);
              }
            }

            // Welcome comment
            const isBug = labels.includes('bug');
            const isFeature = labels.includes('enhancement');

            let response = '';

            if (isBug) {
              response = `Thanks for the bug report! 🐛

To help diagnose faster, please make sure you've included:
- ForkLedger version (\`python -c "import forkledger; print(forkledger.__version__)"\`)
- Python version
- Backend used (json/sqlite)
- Minimal code to reproduce

The maintainer will look into this soon.`;
            } else if (isFeature) {
              response = `Thanks for the feature request! 💡

This has been noted. If you'd like to discuss the use case further, feel free to add more context.`;
            } else {
              response = `Thanks for opening this issue! 👋

The maintainer will respond soon. In the meantime, check the [README](https://github.com/${context.repo.owner}/${context.repo.repo}#readme) and [COMPARISON.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/COMPARISON.md) for documentation.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: response
            });
