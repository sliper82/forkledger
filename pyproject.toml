[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkledger"
version = "0.4.0"
description = "Branch-based decision memory for AI agents — stores choices, alternatives, and regret."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "sliper82" }]
keywords = [
  "rust", "performance", "fts",
  "ai", "memory", "agents", "decision-engine", "counterfactuals",
  "regret", "sqlite", "fastapi", "mcp", "langchain", "llm"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "httpx>=0.27",
]
embeddings = [
  "sentence-transformers>=2.7",
  "numpy>=1.26",
]
mcp = [
  "mcp>=1.0",
  "fastmcp>=0.1",
]
faiss = [
  "faiss-cpu>=1.7",
]
postgres = [
  "psycopg2-binary>=2.9",
]
dashboard = [
  "streamlit>=1.35",
  "pandas>=2.0",
  "altair>=5.0",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "sentence-transformers>=2.7",
  "numpy>=1.26",
  "mcp>=1.0",
  "fastmcp>=0.1",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "fastapi>=0.110",
  "pydantic>=2.0",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/sliper82/forkledger"
Documentation = "https://github.com/sliper82/forkledger#readme"
Repository = "https://github.com/sliper82/forkledger"
"Bug Tracker" = "https://github.com/sliper82/forkledger/issues"
Changelog = "https://github.com/sliper82/forkledger/blob/main/CHANGELOG.md"

[project.scripts]
forkledger = "forkledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
