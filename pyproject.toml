[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkledger"
version = "0.2.0"
description = "A branch-based memory engine for AI systems that learns from decisions, alternatives, and regret."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "sliper82" }
]
keywords = ["ai", "memory", "agents", "decision-engine", "counterfactuals", "regret", "sqlite", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core has zero required dependencies
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
]
embeddings = [
  "sentence-transformers>=2.7",
  "numpy>=1.26",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "sentence-transformers>=2.7",
  "numpy>=1.26",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",   # for FastAPI test client
  "fastapi>=0.110",
  "pydantic>=2.0",
]

[project.scripts]
forkledger = "forkledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
